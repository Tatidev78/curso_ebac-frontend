<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
    <div class="container">
        <img id="avatar" src="./img/profile.jpg" alt="Foto de perfil" class="profile-avatar">
        <h1 id="name" class="profile-name">Thaty Coimbra</h1>
        <h2 id="username" class="profile-username">@Tatidev78</h2>

        <ul class="numbers">
            <li class="number-item">
                <h4>Repositórios</h4> 
                <span id="repos">5</span>
            </li>
            <li class="number-item">
                <h4>Seguidores</h4> 
                <span id="followers">5</span>
            </li>
            <li class="number-item">
                <h4>Seguindo</h4> 
                <span id="following">5</span>
            </li>
        </ul>

        <a id="link" href="https://github.com/Tatidev78" class="profile-link" target="_blank">Ver no Github</a>
    </div>
</header>

    <script src="main.js"></script>
</body>
</html>
